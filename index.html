<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maew Maps</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f6b5c">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maew Maps">
<meta name="description" content="A map of Bangkok's neighbourhood cats. Pin cats you spot, vote on their names and rate how friendly they are.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans+Thai:wght@400;700&display=swap">
<style>
/* Layout: full-screen map with a "place card" panel on the left (bottom sheet on phones), like a maps app */
:root{
  --bg:#f6f7f4; --panel:#ffffff; --ink:#1d2321; --muted:#5e6964; --line:#dfe3df;
  --accent:#0f6b5c;      /* temple-roof teal */
  --accent-ink:#ffffff;
  --marigold:#f2a516;    /* marigold garland */
  --soft:#eaf3f0;
  --danger:#b3261e;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Noto Sans Thai", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121614; --panel:#1b211e; --ink:#e8ece9; --muted:#9aa5a0; --line:#2e3632;
    --accent:#4fc2a8; --accent-ink:#0b1311; --marigold:#f5b83d; --soft:#22302b; --danger:#ff8a80; color-scheme:dark }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);display:flex;flex-direction:column;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}

header{display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);z-index:1000}
.brand{cursor:pointer;font-family:var(--display);font-weight:800;font-size:1.3rem;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;margin:0}
.brand small{font-family:var(--body);font-weight:400;font-size:.85rem;color:var(--muted)}
header .spacer{flex:1}
.btn{white-space:nowrap;border:0;border-radius:999px;padding:9px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:not-allowed}

main{flex:1;display:flex;min-height:0;position:relative}
#panel{width:400px;max-width:100%;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;z-index:500;display:flex;flex-direction:column}
#map{flex:1;min-width:0}
.leaflet-container{background:var(--bg);font:inherit}

.banner{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:900;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;white-space:nowrap}
.banner button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:999px;padding:2px 10px}

.sec{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.sec h2,.sec h3{margin:0;font-family:var(--display);font-weight:600}
.sec h3{font-size:1rem}
.muted{color:var(--muted)}
.intro p{margin:0}

.search{width:100%;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--bg)}

.catlist{list-style:none;margin:0;padding:0}
.catrow{display:flex;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.catrow:hover{background:var(--soft)}
.thumb{width:56px;height:56px;border-radius:12px;flex:none;background-size:cover;background-position:center;display:grid;place-items:center;font-size:1.6rem}
.catrow .info{min-width:0;flex:1}
.catrow .nm{font-weight:700;font-size:1.02rem}
.catrow .sub{color:var(--muted);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--accent);font-weight:700;vertical-align:middle}

.fr{font-size:.92rem}
.danger{border-left:4px solid var(--danger);background:color-mix(in srgb,var(--danger) 10%,var(--panel));padding:10px 12px;border-radius:6px;font-size:.9rem;display:flex;flex-direction:column;gap:4px}
.warntxt{color:var(--danger);font-weight:700}
.warnbtn.on{border-color:var(--danger);color:var(--danger)}
.pin.warnpin{border-color:#d93025}
.locate{width:34px;height:34px;border-radius:4px;border:2px solid rgba(0,0,0,.2);background:#fff;font-size:17px;line-height:1;padding:0;cursor:pointer;background-clip:padding-box}
.locate.busy{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.4}}
.rankchip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 12px;font-weight:700;display:flex;gap:6px;align-items:center;white-space:nowrap}
.rankchip b{color:var(--accent);font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--marigold) 22%,var(--panel));white-space:nowrap;vertical-align:middle}
.myrank{display:flex;gap:14px;align-items:center}.myrank .big{font-size:3rem;line-height:1}
.prog{height:10px;border-radius:999px;background:var(--soft);overflow:hidden}.prog span{display:block;height:100%;background:var(--marigold)}
.earn,.ladder,.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.earn b{display:inline-block;min-width:32px;color:var(--accent)}
.ladder li{display:flex;justify-content:space-between;padding:6px 10px;border-radius:8px}.ladder li.cur{background:var(--soft);font-weight:700}
.board li{display:flex;gap:10px;align-items:center;padding:6px 10px;border-radius:8px}.board li.me{background:var(--soft)}
.board .pl{width:20px;color:var(--muted);font-variant-numeric:tabular-nums}.board .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board b{font-variant-numeric:tabular-nums;min-width:28px;text-align:right}
.rep{background:none;border:0;padding:0;font-size:.8rem;color:var(--muted);align-self:flex-start}
.rep:hover{color:var(--danger);text-decoration:underline}
.repbox{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px;width:100%}
.cact{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.cact .repbox{flex-basis:100%}
.tr{font-size:.8rem;color:var(--accent);text-decoration:none;align-self:flex-start;margin-top:2px}
.tr:hover{text-decoration:underline}
.fading{border-left:4px solid var(--marigold);background:color-mix(in srgb,var(--marigold) 12%,var(--panel));padding:8px 12px;border-radius:6px;font-size:.88rem}
.meter{display:flex;flex-direction:column;gap:2px;max-width:280px}
.meter .track{height:8px;border-radius:999px;background:linear-gradient(90deg,var(--soft),var(--marigold));position:relative}
.meter .track i{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--panel);border:3px solid var(--accent);transform:translate(-50%,-50%)}
.meter .ends{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}

/* Profile card */
.hero{height:200px;background-size:cover;background-position:center;display:grid;place-items:center;font-size:4rem;position:relative;flex:none}
.slides{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;background-size:cover;background-position:center}
.dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:rgba(0,0,0,.35);padding:5px 8px;border-radius:999px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.5)}.dots i.on{background:#fff}
.hero .arr{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:var(--panel);color:var(--ink);font-size:1.1rem;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer}
.hero .arr.l{left:10px}.hero .arr.r{right:10px}
.hero .count{position:absolute;top:10px;right:10px;background:var(--panel);color:var(--ink);font-size:.8rem;padding:3px 10px;border-radius:999px}
.photoacts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.collectbox{border:2px solid var(--accent);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.collectbox.got{border-style:solid;background:color-mix(in srgb,var(--accent) 8%,transparent)}
.rar{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff;vertical-align:middle}
.rar.common{background:#6b7a73}.rar.legendary{background:linear-gradient(90deg,#b8860b,#f2c94c,#b8860b);color:#3a2a00}
.card.legendary{border-color:#d4a017;box-shadow:0 0 12px 2px rgba(242,201,76,.7)}
.pin.legpin{border-color:#f2c94c;box-shadow:0 0 10px 3px rgba(242,201,76,.9)}
.legchip{border-color:#d4a017!important;background:color-mix(in srgb,#f2c94c 25%,transparent)!important}.rar.uncommon{background:#2a7de1}.rar.rare{background:#b5651d}
.colbar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}.colbar i{display:block;height:100%;background:var(--marigold)}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.bdg{display:flex;flex-direction:column;align-items:center;width:76px;text-align:center;font-size:.72rem;line-height:1.2;gap:3px}
.bdg b{font-size:1.6rem;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--marigold) 25%,transparent)}
.bdg.off{opacity:.4;filter:grayscale(1)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;padding:0 16px 16px;list-style:none;margin:0}
.card{border:3px solid #6b7a73;border-radius:14px;overflow:hidden;background:var(--panel);cursor:pointer;display:flex;flex-direction:column}
.card.uncommon{border-color:#2a7de1}.card.rare{border-color:#b5651d;box-shadow:0 0 0 2px color-mix(in srgb,#f2a516 50%,transparent)}
.card .pic{aspect-ratio:1;background-size:cover;background-position:center;display:grid;place-items:center;font-size:2.4rem}
.card .txt{padding:6px 8px;font-size:.8rem;line-height:1.3}.card .txt b{display:block;font-size:.9rem}
.card.mystery{border-style:dashed;border-color:var(--line)}.card.mystery.legendary{border-color:#d4a017}.card.mystery .pic{background:var(--line);color:var(--muted);font-size:2.6rem}
.nophoto{position:absolute;bottom:10px;right:10px;background:var(--panel);color:var(--muted);font-size:.8rem;padding:3px 10px;border-radius:999px}
.hero .back{font-size:.9rem;position:absolute;top:10px;left:10px;background:var(--panel);color:var(--ink);border:0;border-radius:999px;padding:6px 12px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.title{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.1;margin:0;text-wrap:balance}
.ratingline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:.88rem;background:var(--panel)}
label.chip{cursor:pointer;user-select:none}
label.chip input{position:absolute;opacity:0;pointer-events:none}
label.chip:has(input:checked){background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
label.chip:has(input:focus-visible){outline:3px solid var(--marigold)}
.swatch{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.2)}

.names{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.names li{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:30px;border-radius:8px;background:var(--soft);position:relative;overflow:hidden}
.bar span{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--accent) 28%,transparent)}
.bar b{position:relative;padding:0 10px;line-height:30px;font-weight:700}
.bar i{position:absolute;right:10px;line-height:30px;font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.88rem}
.vote{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.85rem;min-width:72px}
.vote.on{background:var(--accent);color:var(--accent-ink)}

.friendly{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.friendly button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 4px;font-size:.75rem;line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:2px}
.friendly button b{font-size:1.1rem}
.friendly button.on{border-color:var(--marigold);background:color-mix(in srgb,var(--marigold) 20%,var(--panel))}

.row{display:flex;gap:8px}
.row > *{min-width:0}
input[type=text],textarea,select{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
textarea{min-height:70px;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px}
.field > span{font-weight:700}
.hint{font-size:.85rem;color:var(--muted)}

.comments{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.comments li{display:flex;flex-direction:column}
.comments .who{font-weight:700;font-size:.9rem}
.comments .when{color:var(--muted);font-size:.8rem;font-weight:400;margin-left:6px}

.dupes{border:2px solid var(--marigold);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:color-mix(in srgb,var(--marigold) 8%,var(--panel))}
.dupes h3{font-size:1rem}
.dupe{display:flex;gap:10px;align-items:center}
.dupe .thumb{width:44px;height:44px;font-size:1.2rem}
.dupe .info{flex:1;min-width:0;font-size:.88rem}
.ok{border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.9rem;color:var(--muted)}

.toast{width:max-content;max-width:calc(100% - 32px);text-align:center;position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:2000;font-weight:700}
.foot{padding:16px 18px;font-size:.82rem;color:var(--muted);margin-top:auto;display:flex;flex-direction:column;gap:8px}
.linkish{background:none;border:0;padding:0;color:var(--danger);text-decoration:underline;font-size:.82rem;align-self:flex-start}

/* Map pins */
.pin{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);display:grid;place-items:center}
.pin span{transform:rotate(45deg);font-size:15px}
.pin.sel{outline:3px solid var(--marigold)}
.pin.new{border-style:dashed}

@media (max-width:720px){
  main{flex-direction:column-reverse}
  .banner{bottom:auto;top:12px;left:auto;right:12px;transform:none;width:auto;max-width:calc(100% - 70px)}
  body.detail #panel{height:78%}
  #panel{transition:height .25s ease;width:100%;height:55%;border-right:0;border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(0,0,0,.12)}
  .brand small{display:none}
  .brand{font-size:1.1rem;white-space:nowrap}
  header .btn,header .rankchip{padding:8px 12px;font-size:.9rem}
  .rankchip span{display:none}
  header{gap:8px}
  .hero{height:150px}
  .banner{white-space:normal;justify-content:space-between;border-radius:14px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<header>
  <h1 class="brand" id="home" role="link" tabindex="0" title="Back to all cats">🐈 Maew Maps <small>Neighbourhood cats, spotted by you</small></h1>
  <span class="spacer"></span>
  <button class="rankchip" id="rankBtn" hidden></button>
  <button class="btn ghost" id="signInBtn" hidden>Sign in</button>
  <button class="btn" id="addBtn">+ Add a cat</button>
</header>
<main>
  <aside id="panel" aria-live="polite"></aside>
  <div id="map" role="application" aria-label="Map of Bangkok"></div>
  <div class="banner" id="banner" hidden>Tap the map where you saw the cat (📍 finds you) <button id="cancelPick">Cancel</button></div>
</main>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>
/* ---------- Things a cat can look like ---------- */
const COATS = {
  ginger:   {label:"Ginger / orange", css:"#e8892c"},
  black:    {label:"Black",           css:"#222"},
  white:    {label:"White",           css:"#f4f4f2"},
  grey:     {label:"Grey",            css:"#8a9196"},
  tabby:    {label:"Brown tabby",     css:"repeating-linear-gradient(45deg,#8a6a45 0 5px,#4b3826 5px 9px)"},
  blackwhite:{label:"Black & white",  css:"linear-gradient(90deg,#222 50%,#f4f4f2 50%)"},
  calico:   {label:"Calico (3 colours)", css:"conic-gradient(#e8892c 0 33%,#222 0 66%,#f4f4f2 0)"},
  tortie:   {label:"Tortoiseshell",   css:"conic-gradient(#222 0 50%,#b5651d 0 75%,#222 0)"},
  pointed:  {label:"Siamese-style (dark face)", css:"radial-gradient(circle,#6b4a32 30%,#efe3cf 32%)"},
  cream:    {label:"Cream",           css:"#ecd7b0"}
};
const FEATURES = {
  kinked:"Kinked or bobbed tail", eartip:"Clipped ear (neutered)", collar:"Wears a collar",
  oneeye:"One eye", limp:"Limps", fluffy:"Long fur", kitten:"Kitten", oddeyes:"Odd-coloured eyes"
};
/* Pedigree breeds are very rare on the soi, so they count as Legendary in the cat collection */
const BREEDS = {persian:"Persian",ragdoll:"Ragdoll",mainecoon:"Maine Coon",british:"British Shorthair",scottish:"Scottish Fold",
  exotic:"Exotic Shorthair",bengal:"Bengal",sphynx:"Sphynx (hairless)",khaomanee:"Khao Manee (Thai, white with odd eyes)",korat:"Korat (Thai, silver-blue)"};
const breedOf = c => (c.features||[]).find(f=>BREEDS[f]);
const FRIENDLY = ["Runs away","Keeps away","Lets you near","Likes a stroke","Lap cat"];

/* ---------- Where the cats are saved ----------
   With these two filled in, everyone shares the same cats (Supabase project URL + publishable key).
   Left empty, cats are saved in this browser only. */
const SUPABASE_URL = "https://vqhowbnyyaczubexkbmm.supabase.co";
const SUPABASE_KEY = "sb_publishable_y2Uw17oesH50tMWYsayHfg_QFcToahs";
const REMOTE = !!(SUPABASE_URL && SUPABASE_KEY && window.supabase);

const KEY="bkkcats.v1"; /* storage key kept so saved cats survive the rename */
function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.cats) return s; }catch(e){} return null; }
function save(){ if(REMOTE) return; try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){ toast("Couldn't save. The photo may be too big."); } }
const ago = d => { const m=Math.round((Date.now()-d)/60000); if(m<1)return"just now"; if(m<60)return m+" min ago"; const h=Math.round(m/60); if(h<24)return h+" h ago"; const dd=Math.round(h/24); if(dd===1)return"yesterday"; if(dd<60)return dd+" days ago"; return Math.round(dd/30.4)+" months ago"; };
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAY=86400000, now=Date.now();

function examples(){ return [
  {id:"ex1",example:true,lat:13.7307,lng:100.5418,area:"Lumpini Park, near the boat lake",coat:"ginger",features:["kinked","eartip"],
   description:"Big chunky ginger boy with a kinked tail. Sleeps on the bench by the paddle boats most afternoons.",
   names:[{n:"Mango",v:7},{n:"Khao Pad",v:4},{n:"Tiger",v:1}],ratings:[5,4,5,4,4,5],sightings:12,photo:null,

  async setPhoto(id,p){ await chk(sb.from("cats").update({photo:p}).eq("id",id)); await refresh(); },

/* Load everything from the shared database and add up the votes and ratings */
async function refresh(){
  const res=await Promise.all(["cats","names","votes","ratings","comments"].map(t=>sb.from(t).select("*")));
  res.forEach(r=>{ if(r.error) throw r.error; });
  const [cats,names,votes,ratings,comments]=res.map(r=>r.data);
  const byId={}, nameById={};
  state.cats=cats.map(c=>byId[c.id]={id:c.id,lat:c.lat,lng:c.lng,coat:c.coat,features:c.features||[],description:c.description,area:c.area,
    photo:c.photo,example:c.example,createdBy:c.created_by,sightings:c.sightings,at:Date.parse(c.created_at),lastSeen:Date.parse(c.last_seen),names:[],ratings:[],comments:[]});
  state.mine={votes:{},rates:{},reported:{},warn:{},collected:{}};
  /* Your collection: every cat you added or logged a sighting of */
  state.cats.forEach(c=>{ if(me && c.createdBy===me) state.mine.collected[c.id]=c.at; });
  const sg=me?await sb.from("sightings").select("cat_id,created_at").eq("user_id",me):{data:[]};
  if(!sg.error) sg.data.forEach(s=>{ const t=Date.parse(s.created_at), k=s.cat_id, o=state.mine.collected;
    if(byId[k] && (!o[k] || t<o[k])) o[k]=t; });
  const wr=await sb.from("warnings").select("cat_id,user_id");   /* "scratched or bit me" flags (once 06 is run) */
  if(!wr.error) wr.data.forEach(w=>{ const c=byId[w.cat_id]; if(c) c.warns=(c.warns||0)+1; if(w.user_id===me) state.mine.warn[w.cat_id]=true; });
  const mine=await sb.from("reports").select("target_type,target_id,reason");   /* only your own reports are visible */
  if(!mine.error) mine.data.forEach(r=>state.mine.reported[r.target_type+":"+r.target_id]=r.reason);
  names.forEach(n=>{ const c=byId[n.cat_id]; if(!c) return; const o={n:n.name,v:0,id:n.id}; nameById[n.id]=o; c.names.push(o); });
  votes.forEach(v=>{ const o=nameById[v.name_id]; if(!o) return; o.v++; if(v.user_id===me) state.mine.votes[v.cat_id]=o.n; });
  ratings.forEach(r=>{ const c=byId[r.cat_id]; if(!c) return; c.ratings.push(r.score); if(r.user_id===me) state.mine.rates[r.cat_id]=r.score; });
  comments.forEach(m=>{ const c=byId[m.cat_id]; if(c) c.comments.push({id:m.id,uid:m.user_id,who:m.who,t:m.body,at:Date.parse(m.created_at)}); });
  /* Spotter points and leaderboard (only once 03-ranks.sql has been run) */
  const [pts,board,prof]=await Promise.all([sb.rpc("all_points"),sb.rpc("leaderboard"),
    me?sb.from("profiles").select("nickname").eq("user_id",me).maybeSingle():Promise.resolve({data:null})]);
  state.ranksOn=!pts.error; state.points={};
  if(!pts.error) pts.data.forEach(r=>state.points[r.user_id]=r.points);
  state.board=board.error?[]:board.data; state.nick=(prof&&prof.data&&prof.data.nickname)||"";
}

const avg = a => a.length? a.reduce((x,y)=>x+y,0)/a.length : 0;
function friendLabel(c){ return c.ratings.length? FRIENDLY[Math.round(avg(c.ratings))-1] : "Not rated yet"; }

  return `<div class="meter" role="img" aria-label="Friendliness: ${friendLabel(c)}"><div class="track">${pct===null?"":`<i style="left:${pct}%"></i>`}</div><div class="ends"><span>Shy</span><span>Cuddly</span></div></div>`; }
function thumbStyle(c){ return c.photo? `background-image:url(${c.photo})` : `background:${(COATS[c.coat]||{}).css||"#ccc"}`; }
function distM(a,b){ const R=6371000,toR=Math.PI/180; const dLat=(b.lat-a.lat)*toR,dLng=(b.lng-a.lng)*toR;
  const x=Math.sin(dLat/2)**2+Math.cos(a.lat*toR)*Math.cos(b.lat*toR)*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }

      <button class="btn" id="sendBtn" style="align-self:flex-start">Email me a sign-in code</button>

      <h2>Check your email</h2>

      <button type="button" class="btn small ghost" id="checkBtn" style="align-self:flex-start">I tapped the link on another device</button></div>
    <form class="sec field" id="codeForm"><span>Code from the email</span>
      <input type="text" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="123456" style="font-size:1.4rem;letter-spacing:.2em;max-width:220px">
      <button class="btn" id="verifyBtn" style="align-self:flex-start">Sign in</button></form>`;
  panel.scrollTop=0;
  document.getElementById("back").onclick=()=> step==="code" ? showSignIn() : goBack();
  if(step!=="code"){
    document.getElementById("emailForm").onsubmit=async e=>{ e.preventDefault();
      signEmail=document.getElementById("email").value.trim().toLowerCase();
      const b=document.getElementById("sendBtn"); b.disabled=true; b.textContent="Sending…";
      try{ await sendCode(signEmail); showSignIn("code"); }
      catch(err){ console.error(err); b.disabled=false; b.textContent="Send me a code";
        toast(/rate|seconds|too many/i.test(err.message||"")?"Too many emails sent. Wait a while and try again.":"Couldn't send the email. Check the address."); } };
  } else {
    document.getElementById("code").focus();
    document.getElementById("checkBtn").onclick=async()=>{ if(await pickUpSignIn()) signedInNow(); else toast("Not signed in yet. Tap the link in the email first."); };
    document.getElementById("codeForm").onsubmit=async e=>{ e.preventDefault();
      const code=document.getElementById("code").value.replace(/\D/g,""); if(code.length<6){ toast("Type the code from the email"); return; }
      const b=document.getElementById("verifyBtn"); b.disabled=true; b.textContent="Checking…";
      try{ await verifyCode(code); signedInNow(); }
      catch(err){ console.error(err); b.disabled=false; b.textContent="Sign in"; toast("That code didn't work. Check it, or go back and get a new one."); } };
  }
}
function goBack(){ const r=returnTo; returnTo=null;
  if(r&&r.view==="cat"&&r.selected) openCat(r.selected); else if(r&&r.view==="ranks"&&!isGuest) showRanks(); else showList(); }
function signedInNow(){ renderChip(); toast("You're signed in. Welcome!"); if(!state.nick) showRanks(); else goBack(); }
const backHere=()=>location.origin+location.pathname;
/* After the email link is tapped (here or on another device), refresh to see if this guest is now a real account */
async function pickUpSignIn(){
  const {data,error}=await sb.auth.refreshSession(); if(error||!data.session) return false;
  const u=data.session.user; me=u.id; isGuest=!!u.is_anonymous; myEmail=u.email||"";
  if(!isGuest) await refresh(); return !isGuest;
}
async function sendCode(email){
  const {data:{session}}=await sb.auth.getSession();
  if(session&&session.user.is_anonymous){   /* turn this guest into a real account, keeping their cats and points */
    const {error}=await sb.auth.updateUser({email},{emailRedirectTo:backHere()});
    if(!error){ signType="email_change"; return; }
    if(!/already|exists|registered/i.test((error.code||"")+" "+(error.message||""))) throw error;
  }
  const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true,emailRedirectTo:backHere()}});   /* returning user, or a new one */
  if(error) throw error; signType="email";
}
async function verifyCode(code){
  const {data,error}=await sb.auth.verifyOtp({email:signEmail,token:code,type:signType});
  if(error) throw error;
  me=data.user.id; isGuest=!!data.user.is_anonymous; myEmail=data.user.email||signEmail;
  await refresh();
}
async function signOut(){
  await sb.auth.signOut(); isGuest=true; myEmail="";
  const r=await sb.auth.signInAnonymously(); if(!r.error){ me=r.data.session.user.id; }
  await refresh(); renderChip(); showList(); toast("Signed out");
}

/* ---------- Photo slideshow: swipe on a phone, arrows on a computer ---------- */
let slideAt=0;
function heroInner(c,extra){
  const pics=[...(c.photo?[{id:null,src:c.photo}]:[]),...extra];
  const n=pics.length;
  return `${n?`<div class="slides" id="slides">${pics.map(p=>`<div class="slide" style="background-image:url(${p.src})"></div>`).join("")}</div>`:""}
    <button class="back" id="back">← All cats</button>
    ${n?"":'<span class="nophoto">No photo yet</span>'}
    ${n>1?`<span class="count" id="slideCount">1 / ${n}</span>
      <button type="button" class="arr l" id="prevPic" aria-label="Previous photo">‹</button><button type="button" class="arr r" id="nextPic" aria-label="Next photo">›</button>
      <div class="dots">${pics.map((_,i)=>`<i class="${i?"":"on"}"></i>`).join("")}</div>`:""}`; }
function wireHero(c,extra){
  const id=c.id, hero=document.getElementById("hero"); if(!hero) return;
  const pics=[...(c.photo?[{id:null,src:c.photo}]:[]),...extra];
  hero.innerHTML=heroInner(c,extra); if(pics.length) hero.style.background="var(--line)";
  document.getElementById("back").onclick=showList;
  const sl=document.getElementById("slides");
  const go=i=>{ if(sl) sl.scrollTo({left:i*sl.clientWidth,behavior:"smooth"}); };
  const show=()=>{ slideAt=Math.round(sl.scrollLeft/Math.max(1,sl.clientWidth));
    hero.querySelectorAll(".dots i").forEach((d,i)=>d.classList.toggle("on",i===slideAt));
    const ct=document.getElementById("slideCount"); if(ct) ct.textContent=`${slideAt+1} / ${pics.length}`;
    photoActs(); };
  if(sl){ sl.onscroll=()=>{ clearTimeout(sl.t); sl.t=setTimeout(show,80); }; }
  const pv=document.getElementById("prevPic"), nx=document.getElementById("nextPic");
  if(pv) pv.onclick=()=>go(slideAt>0?slideAt-1:pics.length-1);
  if(nx) nx.onclick=()=>go(slideAt<pics.length-1?slideAt+1:0);
  slideAt=0;
  /* Buttons under the description: add a photo, and remove or report the one you're looking at */
  function photoActs(){ const box=document.getElementById("photoActs"); if(!box) return;
    const cur=pics[slideAt]||{};
    const canAdd=!c.example && pics.length<11;
    box.innerHTML=`${canAdd?`<label class="btn small ghost">📷 ${pics.length?"Add another photo":"Add a photo"}<input type="file" accept="image/*" id="photoAdd" hidden></label>`:""}
      ${cur.id && (cur.uid===me||cur.uid==="me")?`<button type="button" class="linkish" id="rmPhoto">Remove this photo</button>`:""}
      ${cur.id && cur.uid!==me && cur.uid!=="me" && REMOTE?reportLink("photo",cur.id,"Report this photo"):""}
      ${pics.length>1?`<span class="hint">${pics.length} photos. Swipe the picture to see them all.</span>`:""}`;
    wireReports(()=>{ delete photoCache[id]; openCat(id); });
    const pa=document.getElementById("photoAdd");
    if(pa) pa.onchange=async e=>{ const f=e.target.files[0]; if(!f) return; const ph=await shrink(f);
      const last=pics.length;
      if(await act(()=>c.photo?store.addPhoto(id,ph):store.setPhoto(id,ph),"Photo added. Thanks!")){
        openCat(id); setTimeout(()=>{ const s=document.getElementById("slides"); if(s) s.scrollTo({left:last*s.clientWidth}); },600); } };
    const rm=document.getElementById("rmPhoto");
    if(rm) rm.onclick=async()=>{ if(!confirm("Remove this photo?")) return;
      if(await act(()=>store.removePhoto(id,cur.id),"Photo removed")) openCat(id); }; }
  photoActs();
}

/* ---------- Collecting cats (like Pokémon Go): you have to be near the cat ---------- */
const COLLECT_M=150;
const RARITY={black:"common",white:"common",ginger:"common",tabby:"common",grey:"common",blackwhite:"common",
  tortie:"uncommon",cream:"uncommon",calico:"rare",pointed:"rare"};
const RARE_LABEL={common:"Common",uncommon:"Uncommon",rare:"Rare",legendary:"Legendary"};
const rarity=c=>breedOf(c)?"legendary":RARITY[c.coat]||"common";
const rarChip=c=>`<span class="rar ${rarity(c)}">${{rare:"✨ ",legendary:"👑 "}[rarity(c)]||""}${RARE_LABEL[rarity(c)]}</span>`;
const isCollected=id=>!!(state.mine.collected||{})[id];
const collectable=()=>state.cats.filter(c=>!c.example);
const collectedCount=()=>collectable().filter(c=>isCollected(c.id)).length;
const fmtDate=t=>new Date(t).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
function collectBox(c){
  if(c.example) return `<span class="hint">This is an example cat, so it can't be collected.</span>`;
  const got=(state.mine.collected||{})[c.id];
  return `<div class="collectbox ${got?"got":""}">
    <div>${rarChip(c)} ${got?`<b>✓ In your collection</b> <span class="muted">since ${fmtDate(got)}</span>`:`<b>Not in your collection yet</b>`}</div>
    <button class="btn small ${got?"ghost":""}" id="collectBtn" style="align-self:flex-start">${got?"📍 I'm with this cat again (+1 point)":"📍 I'm with this cat. Collect!"}</button>
    <span class="hint">You need to be within ${COLLECT_M} m of where the cat lives. Your location is checked on your phone and never saved.</span></div>`; }
function whereAmI(){ return new Promise((res,rej)=>{
  if(!navigator.geolocation){ rej({userMsg:"This phone or browser can't share its location."}); return; }
  navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),
    e=>rej({userMsg:e.code===1?"Allow location for Maew Maps to collect cats. It's only checked on your phone.":"Couldn't find your location. Try again outside or near a window."}),
    {enableHighAccuracy:true,timeout:15000,maximumAge:0}); }); }
async function collectCat(id,btn){
  if(needSignIn()) return;
  const c=find(id), first=!isCollected(id), label=btn.textContent;
  btn.disabled=true; btn.textContent="Checking where you are…";
  let pos; try{ pos=await whereAmI(); }catch(e){ toast(e.userMsg||"Couldn't find your location."); btn.disabled=false; btn.textContent=label; return; }
  const d=distM(pos,c), slack=Math.min(pos.acc||0,100);
  if(d-slack>COLLECT_M){ toast(`You need to be near ${topName(c)} to collect it. You're ${fmtDist(d)} away.`); btn.disabled=false; btn.textContent=label; return; }
  btn.textContent="Saving…";
  const ok=await act(()=>store.sighting(id), first?"":"Sighting logged. Thanks!");
  if(ok && first){ collect(id); toast(`🎉 You collected ${topName(c)}! That's ${collectedCount()} of ${collectable().length}.`); }
  if(ok) openCat(id); else { btn.disabled=false; btn.textContent=label; } }

const BADGES=[
  {icon:"🐾",name:"First friend",hint:"Collect your first cat",test:s=>s.n>=1},
  {icon:"🖐️",name:"High five",hint:"Collect 5 cats",test:s=>s.n>=5},
  {icon:"🔟",name:"Cat crew",hint:"Collect 10 cats",test:s=>s.n>=10},
  {icon:"🌟",name:"Uncommon find",hint:"Collect a tortie or cream cat",test:s=>s.tiers.uncommon},
  {icon:"✨",name:"Rare find",hint:"Collect a calico or Siamese-type cat",test:s=>s.tiers.rare},
  {icon:"👑",name:"Legendary find",hint:"Collect a pedigree cat, like a Persian or Ragdoll",test:s=>s.tiers.legendary},
  {icon:"🌈",name:"Every colour",hint:"Collect one of every coat colour",test:s=>Object.keys(COATS).every(k=>s.coats.has(k))}];
function showCollection(){
  setMode("collection"); selected=null; drawMarkers();
  const all=collectable(), got=all.filter(c=>isCollected(c.id)).sort((a,b)=>state.mine.collected[b.id]-state.mine.collected[a.id]),
    not=all.filter(c=>!isCollected(c.id)).sort((a,b)=>({legendary:-1,rare:0,uncommon:1,common:2}[rarity(a)]-{legendary:-1,rare:0,uncommon:1,common:2}[rarity(b)]));
  const s={n:got.length,tiers:{},coats:new Set(got.map(c=>c.coat))}; got.forEach(c=>s.tiers[rarity(c)]=true);
  const pct=all.length?Math.round(got.length/all.length*100):0;
  panel.innerHTML=`
    <div class="sec"><button class="btn small ghost" id="back" style="align-self:flex-start">← All cats</button>
      <h2>🃏 My cat collection</h2>
      <b>You've collected ${got.length} of ${all.length} Bangkok cats</b>
      <div class="colbar"><i style="width:${pct}%"></i></div>
      <span class="hint">Go and find a cat on the map, then press <b>📍 I'm with this cat. Collect!</b> on its profile. You have to be within ${COLLECT_M} m. Cats you add yourself count too.</span>
      ${REMOTE&&isGuest?`<span class="hint"><button type="button" class="linkish" id="colSign">Sign in</button> to start collecting.</span>`:""}
    </div>
    <div class="sec"><h3>Badges</h3><div class="badges">${BADGES.map(b=>`<div class="bdg ${b.test(s)?"":"off"}" title="${b.hint}"><b>${b.icon}</b>${b.name}<span class="muted">${b.test(s)?"Earned":b.hint}</span></div>`).join("")}</div></div>
    <div class="sec" style="padding-bottom:4px"><h3>Your cats</h3>${got.length?"":`<span class="hint">None yet. Your first cat is out there somewhere!</span>`}</div>
    <ul class="cards">${got.map(c=>`<li class="card ${rarity(c)}" data-id="${c.id}" tabindex="0">
      <div class="pic" style="${thumbStyle(c)}">${c.photo?"":"🐱"}</div>
      <div class="txt"><b>${esc(topName(c))}</b>${rarChip(c)}<br><span class="muted">Met ${fmtDate(state.mine.collected[c.id])}</span></div></li>`).join("")}</ul>
    ${not.length?`<div class="sec" style="padding-bottom:4px"><h3>Still to find (${not.length})</h3><span class="hint">Tap a mystery cat to see where it lives.</span></div>
    <ul class="cards">${not.map(c=>`<li class="card mystery ${rarity(c)==="legendary"?"legendary":""}" data-id="${c.id}" tabindex="0">
      <div class="pic">❔</div>
      <div class="txt"><b>Mystery cat</b>${rarChip(c)}<br><span class="muted">${esc(c.area||"Somewhere in Bangkok")}</span></div></li>`).join("")}</ul>`:""}`;
  panel.scrollTop=0;
  document.getElementById("back").onclick=showList;
  const cs=document.getElementById("colSign"); if(cs) cs.onclick=()=>showSignIn();
  panel.querySelectorAll(".card").forEach(r=>{ r.onclick=()=>openCat(r.dataset.id,true); r.onkeydown=e=>{ if(e.key==="Enter") openCat(r.dataset.id,true); }; });
}

/* ---------- Photos: shrink so they fit in the browser's storage ---------- */
function shrink(file){ return new Promise(res=>{ const img=new Image(); img.onload=()=>{
  const s=Math.min(1,500/Math.max(img.width,img.height)); const cv=document.createElement("canvas");
  cv.width=img.width*s; cv.height=img.height*s; cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
  res(cv.toDataURL("image/jpeg",.72)); URL.revokeObjectURL(img.src); }; img.src=URL.createObjectURL(file); }); }

/* ---------- Adding a cat ---------- */
const banner=document.getElementById("banner");
document.getElementById("addBtn").onclick=startPick;
document.getElementById("cancelPick").onclick=cancelAdd;
function startPick(){ if(needSignIn()) return; picking=true; banner.hidden=false; document.getElementById("map").style.cursor="crosshair"; }
function cancelAdd(){ picking=false; banner.hidden=true; document.getElementById("map").style.cursor="";
  if(draftMarker){ map.removeLayer(draftMarker); draftMarker=null; } draft=null; showList(); }
map.on("click",e=>{ if(!picking) return; picking=false; banner.hidden=true; document.getElementById("map").style.cursor="";
  draft={lat:e.latlng.lat,lng:e.latlng.lng,coat:null,features:[],photo:null};
  draftMarker=L.marker(e.latlng,{draggable:true,icon:pinIcon({coat:null},"new")}).addTo(map);
  draftMarker.on("dragend",()=>{ const p=draftMarker.getLatLng(); draft.lat=p.lat; draft.lng=p.lng; checkDupes(); });
  showAddForm();
});

function showAddForm(){
  setMode("add");
  panel.innerHTML=`
    <div class="sec">
      <button type="button" class="btn small ghost" id="cancelTop" style="align-self:flex-start">← Back, don't add a cat</button>
      <h2>New cat</h2>
      <p class="muted" style="margin:0">You can drag the dashed pin if it's in the wrong spot. Fill in what the cat looks like, and we'll check whether someone has already added it.</p>
    </div>
    <form id="addForm">
      <div class="sec field"><span>Main colour</span>
        <div class="chips">${Object.entries(COATS).map(([k,v])=>`<label class="chip"><input type="radio" name="coat" value="${k}"><span class="swatch" style="background:${v.css}"></span>${v.label}</label>`).join("")}</div></div>
      <div class="sec field"><span>Anything that makes it stand out?</span>
        <div class="chips">${Object.entries(FEATURES).map(([k,v])=>`<label class="chip"><input type="checkbox" name="feat" value="${k}">${v}</label>`).join("")}</div>
        <span class="hint">A clipped ear tip means a vet has neutered the cat. Lots of Bangkok street cats have kinked tails.</span></div>
      <div class="sec" id="dupeBox"></div>
      <div class="sec field"><span>Describe it so others can recognise it</span>
        <textarea id="desc" maxlength="400" placeholder="e.g. White with a grey patch over one eye. Sleeps under the motorbike taxi stand."></textarea></div>
      <div class="sec field"><span>Where exactly?</span>
        <input type="text" id="area" maxlength="80" placeholder="e.g. Soi 11, outside the pharmacy"></div>
      <div class="sec field"><span>Suggest a name</span>
        <input type="text" id="nm" maxlength="30" placeholder="e.g. Moo Ping"></div>
      <div class="sec field"><span>How friendly was it?</span>
        <div class="friendly">${FRIENDLY.map((f,i)=>`<label class="chip" style="border-radius:10px;padding:8px 4px;text-align:center;font-size:.75rem;line-height:1.2"><input type="radio" name="fr" value="${i+1}"><b style="display:block;font-size:1.1rem">${i+1}</b>${f}</label>`).join("")}</div>
        <div class="chips"><label class="chip"><input type="checkbox" id="warnNew">🩹 It scratched or bit me</label></div></div>
      <div class="sec field"><span>Is it a pedigree breed?</span>
        <select id="breed"><option value="">No, it's a regular soi cat</option>${Object.entries(BREEDS).map(([k,v])=>`<option value="${k}">👑 ${v}</option>`).join("")}</select>
        <span class="hint">Pedigree cats are very rare on the street, so they become 👑 Legendary in everyone's cat collection. Only pick one if you're fairly sure.</span></div>
      <div class="sec field"><span>Photo (optional)</span><input type="file" id="ph" accept="image/*"></div>
      <div class="sec row"><button class="btn" id="saveNew" type="submit">Save new cat</button><button class="btn ghost" type="button" id="cancelNew">Cancel</button></div>
    </form>`;
  panel.scrollTop=0;
  const f=document.getElementById("addForm");
  f.addEventListener("change",e=>{
    if(e.target.name==="coat"){ draft.coat=e.target.value; draftMarker.setIcon(pinIcon(draft,"new")); }
    if(e.target.name==="feat") draft.features=[...f.querySelectorAll("input[name=feat]:checked")].map(x=>x.value);
    checkDupes();
  });
  document.getElementById("ph").onchange=async e=>{ const x=e.target.files[0]; draft.photo=x?await shrink(x):null; };
  document.getElementById("cancelNew").onclick=cancelAdd;
  document.getElementById("cancelTop").onclick=cancelAdd;
  f.onsubmit=async e=>{ e.preventDefault();
    const desc=document.getElementById("desc").value.trim();
    if(!draft.coat){ toast("Pick the cat's main colour first"); return; }
    if(desc.length<5){ toast("Add a short description so others can recognise it"); document.getElementById("desc").focus(); return; }
    const fr=f.querySelector("input[name=fr]:checked"), nm=document.getElementById("nm").value.trim();
    const br=document.getElementById("breed").value;
    let newId=null; const d={...draft,features:[...draft.features,...(br?[br]:[])],description:desc,area:document.getElementById("area").value.trim(),name:nm,rate:fr?+fr.value:null,warn:document.getElementById("warnNew").checked};
    const btn=document.getElementById("saveNew"); btn.disabled=true; btn.textContent="Saving…";
    if(!await act(async()=>{ newId=await store.addCat(d); },"Cat added to the map!")){ btn.disabled=false; btn.textContent="Save new cat"; return; }
    map.removeLayer(draftMarker); draftMarker=null; draft=null; openCat(newId);
  };
  checkDupes();
}

/* Score each existing cat: how close is it, same colour, same features? */
function checkDupes(){
  const box=document.getElementById("dupeBox"); if(!box||!draft) return;
  const matches=state.cats.map(c=>{
    const d=distM(draft,c); if(d>1500) return null;
    let score=d<300?3:d<800?2:1;
    if(draft.coat){ if(c.coat===draft.coat) score+=4; else score-=3; }
    const shared=c.features.filter(x=>draft.features.includes(x)).length; score+=shared*2;
    return score>=3?{c,d,score,shared}:null;
  }).filter(Boolean).sort((a,b)=>b.score-a.score).slice(0,3);
  if(!matches.length){ box.innerHTML=`<div class="ok">✓ No similar cats nearby${draft.coat?"":" yet. Pick a colour to check more closely"}.</div>`; return; }
  box.innerHTML=`<div class="dupes"><h3>Is it one of these cats?</h3>
    <span class="hint">These cats are already on the map near here and look similar. If it's the same cat, log a sighting instead of adding it again.</span>
    ${matches.map(m=>`<div class="dupe"><div class="thumb" style="${thumbStyle(m.c)}"></div>
      <div class="info"><b>${esc(topName(m.c))}</b> · ${fmtDist(m.d)} away<br><span class="muted">${esc(m.c.description.slice(0,80))}${m.c.description.length>80?"…":""}</span></div>
      <button type="button" class="btn small" data-same="${m.c.id}">Same cat</button></div>`).join("")}</div>`;
  box.querySelectorAll("[data-same]").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.same, nm=topName(find(id));
    if(!await act(()=>store.sighting(id),`Sighting added to ${nm}`)) return;
    map.removeLayer(draftMarker); draftMarker=null; draft=null; openCat(id,true);
  });
}

/* ---------- Start ---------- */
async function start(){
  if(!REMOTE){ drawMarkers(); showList(); return; }
  panel.innerHTML='<div class="sec"><h2>Loading cats…</h2></div>';
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{flowType:"implicit",detectSessionInUrl:true,persistSession:true}});
  try{ /* Everyone gets a quiet anonymous sign-in, so each phone has one vote per cat */
    let {data:{session}}=await sb.auth.getSession();
    if(!session){ const r=await sb.auth.signInAnonymously(); if(r.error) throw r.error; session=r.data.session; }
    me=session.user.id; isGuest=!!session.user.is_anonymous; myEmail=session.user.email||"";
    if(isGuest && location.hash.length>1) await pickUpSignIn();   /* just came back from an email link */
  }catch(e){ console.error(e); }
  const cameBack=!isGuest && /access_token|message=/.test(location.hash);
  if(location.hash.length>1) history.replaceState(null,"",backHere());
  try{ await refresh(); }
  catch(e){ console.error(e); panel.innerHTML='<div class="sec"><h2>Couldn\'t load the cats</h2><p class="muted">Check your internet connection and refresh the page.</p></div>'; return; }
  drawMarkers(); showList(); renderChip();
  if(cameBack){ toast("You're signed in. Welcome!"); if(!state.nick) showRanks(); }
  sb.auth.onAuthStateChange((ev,sess)=>{ if(!sess) return; const u=sess.user;
    if(u.id!==me||(isGuest&&!u.is_anonymous)){ me=u.id; isGuest=!!u.is_anonymous; myEmail=u.email||""; setTimeout(()=>refresh().then(()=>{ renderChip(); if(view==="list") showList(); }).catch(()=>{}),0); } });
  /* Coming back to the app shows cats other people added meanwhile */
  window.addEventListener("focus",async()=>{ if(view!=="list") return; try{ await refresh(); showList(); renderChip(); }catch(e){} });
}
start();
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
